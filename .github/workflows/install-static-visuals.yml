name: Install static Usta Renovasyon visuals

on:
  push:
    branches:
      - visual-static-fix
    paths:
      - ".github/workflows/install-static-visuals.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout visual staging branch
        uses: actions/checkout@v4
        with:
          ref: visual-static-fix
          fetch-depth: 0

      - name: Download original Usta Renovasyon still images once
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/assets
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://media.base44.com/images/public/6a6f3d678abf67625bc566ec/b78127be1_generated_8cb3bf43.png" \
            -o /tmp/hero-original.png
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://media.base44.com/images/public/6a6f3d678abf67625bc566ec/ac4ade23f_generated_0d4ca1f1.png" \
            -o public/assets/about-original.png
          test -s /tmp/hero-original.png
          test -s public/assets/about-original.png

          # Create a sharp 1920x1080 local hero while preserving the original artwork.
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -y -i /tmp/hero-original.png \
              -vf "scale=1920:1080:flags=lanczos,unsharp=5:5:0.55:5:5:0.0" \
              -frames:v 1 public/assets/hero-main.png
          else
            cp /tmp/hero-original.png public/assets/hero-main.png
          fi
          test -s public/assets/hero-main.png

      - name: Create branded fallback visuals
        shell: bash
        run: |
          set -euo pipefail
          cat > public/assets/brand-workmanship.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
            <title id="t">Usta Renovasyon çalışma ve hizmet görseli</title>
            <desc id="d">Lacivert ve turuncu kurumsal tasarım, ev, boya ve tadilat temaları</desc>
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08152b"/><stop offset="1" stop-color="#132443"/></linearGradient>
              <pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
            </defs>
            <rect width="1200" height="800" fill="url(#bg)"/><rect width="1200" height="800" fill="url(#g)"/>
            <path d="M0 610 370 310l170 138 178-174 482 385v141H0Z" fill="#0d1c35"/>
            <path d="M120 360 360 155l240 205" fill="none" stroke="#ff9d00" stroke-width="35" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M190 360h335v235H190z" fill="#f5f7fb" opacity=".96"/><path d="M300 455h112v140H300z" fill="#ff9d00"/>
            <rect x="690" y="165" width="360" height="42" rx="21" fill="#ff9d00"/><rect x="690" y="225" width="260" height="18" rx="9" fill="#f5f7fb" opacity=".85"/>
            <text x="690" y="335" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="68" font-weight="800">USTA</text>
            <text x="690" y="405" fill="#ff9d00" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="800">RENOVASYON</text>
            <text x="690" y="470" fill="#cbd3df" font-family="Arial,Helvetica,sans-serif" font-size="27">ALÇI • BOYA • DIŞ CEPHE</text>
            <text x="690" y="510" fill="#cbd3df" font-family="Arial,Helvetica,sans-serif" font-size="27">MANTOLAMA • TADİLAT</text>
            <rect x="690" y="565" width="390" height="92" rx="22" fill="#ff9d00"/>
            <text x="885" y="622" text-anchor="middle" fill="#07152a" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">0536 035 88 98</text>
          </svg>
          SVG

          cat > public/assets/brand-contact.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
            <title id="t">Özal Usta iletişim görseli</title>
            <desc id="d">Usta Renovasyon iletişim bilgileri için lacivert, turuncu ve beyaz kurumsal kart</desc>
            <rect width="1200" height="800" fill="#f8fafc"/>
            <path d="M0 0h510L650 400 510 800H0Z" fill="#08162e"/><path d="M455 0h68L665 400 523 800h-68L597 400Z" fill="#ff9300"/>
            <path d="M120 270 275 135l155 135" fill="none" stroke="#ff9300" stroke-width="28" stroke-linecap="round"/><path d="M165 270h220v180H165z" fill="#ffffff"/><rect x="245" y="340" width="65" height="110" fill="#ff9300"/>
            <text x="275" y="545" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900">USTA</text><text x="275" y="600" text-anchor="middle" fill="#ff9300" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="800">RENOVASYON</text>
            <text x="705" y="190" fill="#0b1b38" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="900">Özal Usta</text>
            <line x1="705" y1="225" x2="1080" y2="225" stroke="#ff9300" stroke-width="7"/>
            <text x="705" y="330" fill="#0b1b38" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700">Telefon: 0536 035 88 98</text>
            <text x="705" y="405" fill="#0b1b38" font-family="Arial,Helvetica,sans-serif" font-size="30">Web: www.ustarenovasyon.com</text>
            <text x="705" y="480" fill="#0b1b38" font-family="Arial,Helvetica,sans-serif" font-size="30">E-posta: ustarenovasyon@gmail.com</text>
            <text x="705" y="555" fill="#0b1b38" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">İzmir Geneli Hizmet</text>
            <rect x="705" y="620" width="370" height="72" rx="18" fill="#0b1b38"/><text x="890" y="666" text-anchor="middle" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">Ustalık • Güven • Temiz İşçilik</text>
          </svg>
          SVG

      - name: Replace video and placeholder visuals
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          Path("src/components/home/HeroVideo.jsx").write_text('''import React from "react";\nimport { Image } from "@/components/ui/image";\n\nconst HERO_STILL = "/assets/hero-main.png";\n\n// Kullanıcı isteği: hareketli video yok; yüksek çözünürlüklü sabit ana görsel kullanılır.\nexport default function HeroVideo() {\n  return (\n    <section className="w-full bg-primary" aria-label="Usta Renovasyon ana görseli">\n      <div className="mx-auto w-full overflow-hidden bg-primary">\n        <Image\n          src={HERO_STILL}\n          alt="Usta Renovasyon iç ve dış cephe uygulamalarında çalışan ekip"\n          className="aspect-video w-full"\n          fittingType="fit"\n          loading="eager"\n        />\n      </div>\n    </section>\n  );\n}\n''')

          hero = Path("src/components/home/Hero.jsx")
          s = hero.read_text()
          s = s.replace('"/assets/hero-renovation.svg"', '"/assets/brand-workmanship.svg"')
          s = s.replace('alt="İzmir\'de yenilenmiş ferah ve modern daire iç mekan"', 'alt="Usta Renovasyon hizmet ve iletişim görseli"')
          hero.write_text(s)

          about_teaser = Path("src/components/home/AboutTeaser.jsx")
          s = about_teaser.read_text().replace('"/assets/about-renovation.svg"', '"/assets/about-original.png"')
          s = s.replace('alt="Usta eliyle pürüzsüz alçı sıva uygulaması detayı"', 'alt="Usta Renovasyon alçı, boya ve tadilat çalışma görseli"')
          about_teaser.write_text(s)

          about = Path("src/lib/aboutContent.js")
          s = about.read_text()
          s = s.replace('heroImage: "/assets/hero-renovation.svg",', 'heroImage: "/assets/hero-main.png",')
          s = s.replace('introImage: "/assets/about-renovation.svg",', 'introImage: "/assets/about-original.png",')
          s = s.replace('ozalPhoto: "", // Gerçek fotoğraf eklenene kadar boş; çalışma görseli kullanılır, Özal Usta olarak etiketlenmez.', 'ozalPhoto: "/assets/brand-contact.svg", // Kurumsal iletişim görseli; kişi portresi olarak kullanılmaz.')
          about.write_text(s)

          about_page = Path("src/pages/About.jsx")
          s = about_page.read_text()
          s = s.replace('alt={data.ozalPhoto ? "Usta Renovasyon kurucusu Özal Usta" : "Usta Renovasyon çalışma alanı"}', 'alt="Özal Usta ve Usta Renovasyon iletişim bilgileri"')
          about_page.write_text(s)

          image_ui = Path("src/components/ui/image.jsx")
          s = image_ui.read_text().replace('"/assets/renovation-placeholder.svg"', '"/assets/brand-workmanship.svg"')
          image_ui.write_text(s)
          PY

          rm -f public/assets/hero-site-video.mp4

      - name: Install and verify production build
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
          test -f dist/assets/hero-main.png
          test -f dist/assets/about-original.png
          test -f dist/assets/brand-workmanship.svg
          test -f dist/assets/brand-contact.svg
          test ! -f dist/assets/hero-site-video.mp4
          if grep -RniE 'base44|@base44|base44Client|hero-site-video\.mp4' src public package.json vite.config.js 2>/dev/null; then
            echo 'Forbidden Base44/video reference remains in final source.' >&2
            exit 1
          fi

      - name: Commit final static visuals to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/install-static-visuals.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace hero video with sharp static visuals"
          git push origin HEAD:main
